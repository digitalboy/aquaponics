<!DOCTYPE html>
<html lang="zh-CN">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>

<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden select-none">

  <!-- ========================================================================= -->

    <div class="flex items-center gap-4 flex-wrap">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 border border-amber-500/40 flex items-center justify-center font-black text-sm">📐</span>
        <div>

        </div>
      </div>

      <div class="h-5 w-px bg-slate-800 hidden md:block"></div>

        <button id="tab-sheet-2" onclick="switchSheet(2)" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5 font-bold">

        </button>
        <button id="tab-sheet-3" onclick="switchSheet(3)" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5 font-bold">
          <span>📶</span> 图卷 3: ELEC-03 RS-485 总线与网络拓扑图
        </button>
      </div>
    </div>

    <!-- 中间: 视图缩放与平移控制按键 -->
    <div class="flex items-center gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800 font-cad text-xs">
      <button onclick="zoomCanvas(1.2)" class="px-2 py-1 rounded hover:bg-slate-800 text-slate-300 hover:text-white transition" title="放大 (滚轮向上)">🔍+</button>
      <button onclick="zoomCanvas(0.833)" class="px-2 py-1 rounded hover:bg-slate-800 text-slate-300 hover:text-white transition" title="缩小 (滚轮向下)">🔍-</button>
      <button onclick="resetZoom()" class="px-2 py-1 rounded hover:bg-slate-800 text-slate-300 hover:text-white transition" title="1:1 原图">1:1</button>
      <button onclick="fitCanvas()" class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 transition font-bold" title="居中自适应">⛶ 适屏</button>
      <span id="zoom-level-text" class="px-1 text-slate-400 text-[11px]">100%</span>

    <div class="flex items-center gap-3">
      
      <!-- 主题切换: CAD 深色 / 白图 -->
      <button onclick="toggleCadTheme()" id="btn-theme" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-cad transition border border-slate-700 flex items-center gap-1.5">

        <span>📝</span> JSON 源

      </g>

    let zoomScale = 0.95;
    let panX = 40;
    let panY = 20;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let isDarkTheme = true;

    const viewport = document.getElementById('cad-viewport');
    const svgElem = document.getElementById('cad-svg');
    const drawingLayer = document.getElementById('cad-drawing-layer');
    const zoomText = document.getElementById('zoom-level-text');
    const mouseCoords = document.getElementById('mouse-coords');
    const jsonEditor = document.getElementById('json-editor-textarea');

    // =========================================================================
    // 纯独立 SVG 符号生成器 (完全自闭合，绝不依赖 <use>，杜绝任何坐标穿透杂线)
    // =========================================================================
    function drawSymbolMCCB(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <rect x="-12" y="-18" width="24" height="36" fill="${isDarkTheme ? '#0f172a' : '#ffffff'}" stroke="${color}" stroke-width="2" />
          <line x1="-12" y1="-18" x2="12" y2="18" stroke="${color}" stroke-width="2" />
          <line x1="-12" y1="18" x2="12" y2="-18" stroke="${color}" stroke-width="2" />
          <line x1="0" y1="-26" x2="0" y2="-18" stroke="${color}" stroke-width="2" />
          <line x1="0" y1="18" x2="0" y2="26" stroke="${color}" stroke-width="2" />
        </g>
      `;
    }

    function drawSymbolMCB(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <line x1="0" y1="-22" x2="0" y2="-10" stroke="${color}" stroke-width="2" />
          <line x1="0" y1="-10" x2="-8" y2="8" stroke="${color}" stroke-width="2" />
          <line x1="0" y1="10" x2="0" y2="22" stroke="${color}" stroke-width="2" />
          <rect x="-14" y="-6" width="6" height="12" fill="none" stroke="${color}" stroke-width="1.5" />
        </g>
      `;
    }

    function drawSymbolCT(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <circle cx="0" cy="0" r="10" fill="none" stroke="${color}" stroke-width="2" />
          <circle cx="0" cy="0" r="4" fill="${color}" />
          <line x1="10" y1="0" x2="22" y2="0" stroke="${color}" stroke-width="1.5" stroke-dasharray="2,2" />
        </g>
      `;
    }

    function drawSymbolSPD(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <rect x="-12" y="-12" width="24" height="24" fill="${isDarkTheme ? '#0f172a' : '#ffffff'}" stroke="${color}" stroke-width="1.8" />
          <path d="M-8,6 L0,-6 L8,-6 L0,6 Z" fill="${color}" />
          <line x1="0" y1="-18" x2="0" y2="-12" stroke="${color}" stroke-width="2" />
          <line x1="0" y1="12" x2="0" y2="20" stroke="${color}" stroke-width="2" />
          <line x1="-10" y1="20" x2="10" y2="20" stroke="${color}" stroke-width="2" />
          <line x1="-6" y1="24" x2="6" y2="24" stroke="${color}" stroke-width="2" />
          <line x1="-2" y1="28" x2="2" y2="28" stroke="${color}" stroke-width="2" />
        </g>
      `;
    }

    function drawSymbolVFD(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <rect x="-24" y="-20" width="48" height="40" fill="${isDarkTheme ? '#0f172a' : '#ffffff'}" stroke="${color}" stroke-width="2" rx="3" />
          <line x1="-24" y1="-20" x2="24" y2="20" stroke="${color}" stroke-width="1" />
          <text x="-16" y="-4" fill="${color}" font-size="10" font-family="monospace">~</text>
          <text x="6" y="14" fill="${color}" font-size="10" font-family="monospace">=</text>
          <text x="-8" y="5" fill="${color}" font-size="8" font-family="monospace">VFD</text>
        </g>
      `;
    }

    function drawSymbolMotor(x, y, color) {
      return `
        <g transform="translate(${x}, ${y})">
          <circle cx="0" cy="0" r="18" fill="${isDarkTheme ? '#0f172a' : '#ffffff'}" stroke="${color}" stroke-width="2" />
          <text x="-7" y="5" fill="${color}" font-size="13" font-weight="bold" font-family="sans-serif">M</text>
          <text x="3" y="10" fill="${color}" font-size="9" font-family="monospace">3~</text>
          <line x1="0" y1="-26" x2="0" y2="-18" stroke="${color}" stroke-width="2" />
        </g>
      `;
    }

    /**
     * 切换工程图卷 (1: 强电一次图, 2: PLC原理图, 3: 485与网络图)
     */
    function switchSheet(sheetIdx) {
      currentSheetIndex = sheetIdx;

      for (let i = 1; i <= 3; i++) {
        const btn = document.getElementById(`tab-sheet-${i}`);
        if (i === sheetIdx) {
          btn.className = 'px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-black transition flex items-center gap-1.5 shadow-sm';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition flex items-center gap-1.5 font-bold';
        }
      }

      const sheetTitles = {
        1: { title: '全厂低压动力配电一次系统图', code: 'ELEC-01-SLD', disc: '强电动力工程 (Power Distribution)' },
        2: { title: 'PLC 自动化控制与 I/O 接线原理图', code: 'ELEC-02-PLC', disc: '自动化与仪器仪表 (Instrumentation)' },
        3: { title: 'RS-485 现场总线与工控网络拓扑图', code: 'ELEC-03-NET', disc: '弱电通信与物联网 (IIoT Network)' }
      };

      const meta = sheetTitles[sheetIdx];
      document.getElementById('current-sheet-badge').textContent = `图卷 ${sheetIdx} / 共 3 卷`;
      document.getElementById('current-sheet-title').textContent = meta.title;
      document.getElementById('current-sheet-code').textContent = meta.code;

      document.getElementById('titleblock-sheet-name').textContent = meta.title;
      document.getElementById('titleblock-sheet-code').innerHTML = `图号: <tspan fill="#f59e0b" font-family="monospace">${meta.code}</tspan>`;
      document.getElementById('titleblock-discipline').innerHTML = `专业: <tspan fill="#38bdf8" font-family="monospace">${meta.disc}</tspan>`;

      renderCurrentSheet();
    }

    function renderCurrentSheet() {
      if (currentSheetIndex === 1) renderSheet1_PowerSLD(PlantWideData);
      else if (currentSheetIndex === 2) renderSheet2_PlcSchematic(PlantWideData);
      else if (currentSheetIndex === 3) renderSheet3_NetworkFieldbus(PlantWideData);
    }

    // =========================================================================
    // 🎨 图卷 1: ELEC-01 全厂低压动力配电一次系统图 (纯正交直角制图，绝无杂线)
    // =========================================================================
    function renderSheet1_PowerSLD(data) {
      if (!drawingLayer) return;
      drawingLayer.innerHTML = '';

      const colorWire = isDarkTheme ? '#38bdf8' : '#0369a1';
      const colorBus = isDarkTheme ? '#f59e0b' : '#d97706';
      const colorText = isDarkTheme ? '#f8fafc' : '#0f172a';
      const colorMuted = isDarkTheme ? '#94a3b8' : '#64748b';
      const colorBoxBg = isDarkTheme ? '#0f172a' : '#f8fafc';
      const colorBorder = isDarkTheme ? '#475569' : '#94a3b8';

      let html = '';

      // 1. 10kV 进线与变压器 (完全正交垂直排布)
      const startX = 140;
      const startY = 110;
      html += `
        <text x="${startX}" y="${startY - 35}" fill="${colorText}" font-size="13" font-weight="bold" font-family="monospace">10kV 市电进线 (双电源ATS自投)</text>
        <line x1="${startX + 70}" y1="${startY - 20}" x2="${startX + 70}" y2="${startY}" stroke="${colorWire}" stroke-width="2.5" />
        <circle cx="${startX + 70}" cy="${startY + 20}" r="20" fill="none" stroke="${colorWire}" stroke-width="2.5" />
        <circle cx="${startX + 70}" cy="${startY + 45}" r="20" fill="none" stroke="${colorWire}" stroke-width="2.5" />
        <text x="${startX + 105}" y="${startY + 38}" fill="${colorText}" font-size="12" font-family="monospace">100kVA (10/0.4kV)</text>
        <line x1="${startX + 70}" y1="${startY + 65}" x2="${startX + 70}" y2="${startY + 95}" stroke="${colorWire}" stroke-width="2.5" />
      `;

      // 2. AP-MAIN 一级总柜
      const mainY = startY + 95;
      const incomer = data.power_distribution.main_incomer;
      html += `
        <rect x="${startX - 20}" y="${mainY}" width="380" height="240" fill="${colorBoxBg}" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" rx="8" />
        <text x="${startX - 5}" y="${mainY + 24}" fill="#f59e0b" font-size="13" font-weight="extrabold" font-family="monospace">AP-MAIN 一级低压动力总柜</text>
        
        ${drawSymbolMCCB(startX + 70, mainY + 65, colorText)}
        <text x="${startX + 95}" y="${mainY + 65}" fill="${colorText}" font-size="11" font-weight="bold" font-family="monospace">QF0: ${incomer.main_breaker.model} 160A/3P (D型)</text>
        <text x="${startX + 95}" y="${mainY + 80}" fill="${colorMuted}" font-size="10" font-family="monospace">Icu=36kA • Ii=1600A • 双拼电缆</text>
        
        ${drawSymbolCT(startX + 70, mainY + 125, colorWire)}
        <text x="${startX + 95}" y="${mainY + 130}" fill="${colorText}" font-size="11" font-family="monospace">TA1~3: 200/5A (0.5级开合式)</text>
        
        <rect x="${startX + 230}" y="${mainY + 150}" width="115" height="35" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" rx="4" />
        <text x="${startX + 240}" y="${mainY + 172}" fill="${colorText}" font-size="10" font-weight="bold" font-family="monospace">威胜智能电能表</text>
        
        <line x1="${startX + 70}" y1="${mainY + 170}" x2="${startX + 20}" y2="${mainY + 170}" stroke="${colorWire}" stroke-width="2" />
        ${drawSymbolSPD(startX + 20, mainY + 185, '#34d399')}
        <text x="${startX - 8}" y="${mainY + 225}" fill="${colorMuted}" font-size="9" font-family="monospace">SPD 40kA T1</text>
        
        <!-- 正交垂直引下线至主母线 -->
        <line x1="${startX + 70}" y1="${mainY + 140}" x2="${startX + 70}" y2="${mainY + 280}" stroke="${colorWire}" stroke-width="3" />
      `;

      // 3. 380V/220V 主母排 (TMY 水平总线)
      const busY = mainY + 280;
      html += `
        <line x1="80" y1="${busY}" x2="2280" y2="${busY}" stroke="${colorBus}" stroke-width="6" stroke-linecap="round" />
        <text x="90" y="${busY - 12}" fill="${colorBus}" font-size="14" font-weight="extrabold" font-family="monospace">380V/220V 一级配电主母线 TMY-3x(40x4)+1x(25x3)</text>
      `;

      // 4. 二级动力分箱矩阵 (100% 正交垂直向下分支)
      let currentX = 120;
      data.power_distribution.sub_panels.forEach((panel) => {
        const circuitCount = panel.circuits.length;
        const panelWidth = Math.max(circuitCount * 125 + 60, 360);
        const panelY = busY + 60;
        const feedX = currentX + 60;

        // 母线垂直引下线至分箱开关
        html += `
          <line x1="${feedX}" y1="${busY}" x2="${feedX}" y2="${panelY + 60}" stroke="${colorWire}" stroke-width="2.5" />
          <circle cx="${feedX}" cy="${busY}" r="4" fill="${colorBus}" />
          
          <rect x="${currentX}" y="${panelY}" width="${panelWidth}" height="820" fill="${colorBoxBg}" stroke="${colorBorder}" stroke-width="2" rx="10" />
          <rect x="${currentX}" y="${panelY}" width="${panelWidth}" height="45" fill="${isDarkTheme ? '#1e293b' : '#e2e8f0'}" rx="10" />
          <text x="${currentX + 16}" y="${panelY + 28}" fill="${colorText}" font-size="13" font-weight="extrabold" font-family="monospace">${panel.panel_id} ${panel.name}</text>
          <text x="${currentX + panelWidth - 140}" y="${panelY + 28}" fill="${colorMuted}" font-size="11" font-family="monospace">${panel.feeder_cable.spec}</text>
          
          ${drawSymbolMCB(feedX, panelY + 85, colorText)}
          <text x="${feedX + 18}" y="${panelY + 85}" fill="${colorText}" font-size="10" font-weight="bold" font-family="monospace">${panel.incoming_switch.model} ${panel.incoming_switch.rated_current_a}A/3P (${panel.incoming_switch.trip_curve}型)</text>
          <line x1="${feedX}" y1="${panelY + 110}" x2="${feedX}" y2="${panelY + 145}" stroke="${colorWire}" stroke-width="2.5" />
        `;

        // 二级箱体内部水平小母排
        const subBusY = panelY + 145;
        const subBusStartX = currentX + 30;
        const subBusEndX = currentX + panelWidth - 30;
        html += `
          <line x1="${subBusStartX}" y1="${subBusY}" x2="${subBusEndX}" y2="${subBusY}" stroke="${colorBus}" stroke-width="4" stroke-linecap="round" />
          <text x="${subBusStartX}" y="${subBusY - 8}" fill="${colorBus}" font-size="10" font-family="monospace">分箱母排 380V/220V</text>
        `;

        // 各分支回路垂直向下正交排布
        panel.circuits.forEach((c, cIdx) => {
          const cX = currentX + 60 + cIdx * 125;
          html += `
            <circle cx="${cX}" cy="${subBusY}" r="3" fill="${colorBus}" />
            <line x1="${cX}" y1="${subBusY}" x2="${cX}" y2="${subBusY + 35}" stroke="${colorWire}" stroke-width="2" />
            
            ${drawSymbolMCB(cX, subBusY + 55, colorText)}
            <text x="${cX + 12}" y="${subBusY + 52}" fill="${colorText}" font-size="9" font-weight="bold" font-family="monospace">${c.breaker.model}</text>
            <text x="${cX + 12}" y="${subBusY + 64}" fill="${colorMuted}" font-size="9" font-family="monospace">${c.breaker.rated_current_a}A (${c.breaker.trip_curve}型)</text>
            
            <line x1="${cX}" y1="${subBusY + 75}" x2="${cX}" y2="${subBusY + 120}" stroke="${colorWire}" stroke-width="2" />
            
            <!-- 电缆引线标注 -->
            <g transform="translate(${cX}, ${subBusY + 150})">
              <line x1="0" y1="-30" x2="0" y2="20" stroke="${colorWire}" stroke-width="1.5" />
              <line x1="0" y1="0" x2="35" y2="-15" stroke="${colorMuted}" stroke-width="1" />
              <line x1="35" y1="-15" x2="95" y2="-15" stroke="${colorMuted}" stroke-width="1" />
              <text x="8" y="-18" fill="${colorMuted}" font-size="8.5" font-family="monospace">${c.cable.spec}</text>
              <text x="8" y="-6" fill="${colorMuted}" font-size="8.5" font-family="monospace">L=${c.cable.length_m}m</text>
            </g>
          `;

          let motorY = subBusY + 380;
          if (c.load.is_vfd_driven) {
            html += `
              <line x1="${cX}" y1="${subBusY + 170}" x2="${cX}" y2="${subBusY + 240}" stroke="${colorWire}" stroke-width="2" />
              ${drawSymbolVFD(cX, subBusY + 260, colorWire)}
              <text x="${cX - 20}" y="${subBusY + 295}" fill="${colorText}" font-size="8.5" font-family="monospace">变频器</text>
              <line x1="${cX}" y1="${subBusY + 280}" x2="${cX}" y2="${motorY - 26}" stroke="${colorWire}" stroke-width="2" />
            `;
          } else {
            html += `<line x1="${cX}" y1="${subBusY + 170}" x2="${cX}" y2="${motorY - 26}" stroke="${colorWire}" stroke-width="2" />`;
          }

          html += `
            ${drawSymbolMotor(cX, motorY, '#34d399')}
            <text x="${cX - 45}" y="${motorY + 35}" fill="${colorText}" font-size="9.5" font-weight="bold" font-family="monospace">${c.circuit_id}: ${c.name}</text>
            <text x="${cX - 45}" y="${motorY + 50}" fill="${colorMuted}" font-size="9" font-family="monospace">Pe=${c.load.rated_power_kw}kW Ie=${c.load.rated_current_a}A</text>
          `;
        });

        currentX += panelWidth + 50;
      });

      drawingLayer.innerHTML = html;
    }

    // =========================================================================

    /**
     * 视口变换与交互控制
     */
    function updateTransform() {
      if (!svgElem) return;
      svgElem.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
      if (zoomText) zoomText.textContent = `${Math.round(zoomScale * 100)}%`;
    }

    function zoomCanvas(factor) {
      zoomScale = Math.min(Math.max(zoomScale * factor, 0.2), 3.0);
      updateTransform();
    }

    function resetZoom() {
      zoomScale = 1.0;
      panX = 40;
      panY = 20;
      updateTransform();
    }

    function fitCanvas() {
      const containerWidth = viewport.clientWidth;
      zoomScale = Math.min(containerWidth / 2450, 1.2);
      panX = 20;
      panY = 10;
      updateTransform();
    }

    viewport.addEventListener('mousedown', (e) => {
      if (e.button === 0 || e.button === 1) {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      }
      if (mouseCoords) {
        const rect = viewport.getBoundingClientRect();
        const curX = Math.round((e.clientX - rect.left - panX) / zoomScale);
        const curY = Math.round((e.clientY - rect.top - panY) / zoomScale);
        mouseCoords.textContent = `X: ${curX}, Y: ${curY}`;
      }
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      zoomCanvas(factor);
    }, { passive: false });

    function toggleCadTheme() {
      isDarkTheme = !isDarkTheme;
      const themeText = document.getElementById('theme-text');
      const themeIcon = document.getElementById('theme-icon');

      if (isDarkTheme) {
        viewport.className = 'flex-1 relative overflow-hidden cad-grid-dark cursor-grab active:cursor-grabbing';
        if (themeText) themeText.textContent = 'CAD 暗黑';
        if (themeIcon) themeIcon.textContent = '🌙';
      } else {
        viewport.className = 'flex-1 relative overflow-hidden cad-grid-light cursor-grab active:cursor-grabbing';
        if (themeText) themeText.textContent = '设计院白图';
        if (themeIcon) themeIcon.textContent = '☀️';
      }
      renderCurrentSheet();
    }

    function toggleJsonDrawer() {
      const drawer = document.getElementById('json-drawer');
      if (!drawer) return;
      if (drawer.classList.contains('translate-x-full')) {
        drawer.classList.remove('translate-x-full');
        if (jsonEditor) jsonEditor.value = JSON.stringify(PlantWideData, null, 2);
      } else {
        drawer.classList.add('translate-x-full');
      }
    }

    function compileAndRenderFromTextarea() {
      const status = document.getElementById('json-status');
      try {
        const parsed = JSON.parse(jsonEditor.value);
        Object.assign(PlantWideData, parsed);
        renderCurrentSheet();
        if (status) {
          status.className = 'text-xs font-cad text-emerald-400';
          status.textContent = '✓ 编译成功，已重新排版渲染 3 卷图纸！';
        }
        setTimeout(() => toggleJsonDrawer(), 600);
      } catch (err) {
        if (status) {
          status.className = 'text-xs font-cad text-red-400';
          status.textContent = '❌ JSON 解析错误: ' + err.message;
        }
      }
    }

    function exportSvgDrawing() {
      const svgData = new XMLSerializer().serializeToString(svgElem);
      const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ELEC-0${currentSheetIndex}-Drawing-Sheet.svg`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    window.addEventListener('DOMContentLoaded', () => {
      switchSheet(1);
      fitCanvas();
    });
  </script>
