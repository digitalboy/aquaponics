name = "aquaponics-video-gateway"
main = "src/index.ts"
compatibility_date = "2024-11-01"

routes = [
  { pattern = "video-gw.guoshu.dev", custom_domain = true }
]

[vars]
DEFAULT_SITE_ID = "guangming-01"
WAKE_TTL_SEC = "180"
TOKEN_TTL_SEC = "600"
ALLOWED_ORIGINS = "*"
ALERT_EMAIL_TO = "digitalboyzone@gmail.com"
ALERT_EMAIL_FROM = "video-alert@guoshu.dev"
HEARTBEAT_TIMEOUT_SEC = "300"
SNAPSHOT_STALE_SEC = "1500"
ALERT_COOLDOWN_SEC = "1800"
DIGEST_INTERVAL_SEC = "3600"

[triggers]
crons = ["*/2 * * * *"]

[[send_email]]
name = "EMAIL"
destination_address = "digitalboyzone@gmail.com"

[[d1_databases]]
binding = "VIDEO_DB"
database_name = "aquaponics-video-db"
database_id = "872bd8e2-012e-4922-bc43-8b48314e87f2"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "VIDEO_R2"
bucket_name = "aquaponics-video-media"

# 生产环境请通过 wrangler secret put 注入以下敏感密钥：
# - AGENT_SECRET: 边缘倍控 N100 心跳与上传 HMAC-SHA256 密钥
# - SIGNING_SECRET: 对外短时效播放 Token HMAC-SHA256 密钥
# - INTERNAL_API_KEY: 内部业务系统（大屏/告警服务）调用鉴权密钥
