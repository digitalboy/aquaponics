# MediaMTX 本地 RTSP 单次复用配置 (倍控 N100)
# 仅允许 MediaMTX 直连海康枪机子码流 (102)，sourceOnDemand=yes 确保空闲时不消耗局域网带宽

logLevel: info
rtspAddress: :8554
rtspTransports: [tcp]

# 按需启用 WebRTC (后续低延迟直连预留)
webrtc: yes
webrtcAddress: :8889

paths:
  CAM-GATE-IN-01:
    source: rtsp://${HIK_USER}:${HIK_PASS}@192.168.0.214:554/Streaming/Channels/102
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 15s

  CAM-GATE-IN-01-HD:
    source: rtsp://${HIK_USER}:${HIK_PASS}@192.168.0.214:554/Streaming/Channels/101
    sourceOnDemand: yes
    sourceOnDemandCloseAfter: 10s

  CAM-GATE-OUT-01:
