[project]
name = "aquaponics-video-agent"
version = "1.0.0"
description = "倍控 N100 边缘视频采集、tmpfs 内存盘切片与 4G 按需唤醒推流守护服务"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
]

[project.scripts]
video-agent = "video_agent.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
