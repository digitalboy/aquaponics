name: Docs Governance Check

on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "tools/audit_*.py"
      - ".github/workflows/docs-check.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "tools/audit_*.py"
      - ".github/workflows/docs-check.yml"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Docs SSOT & Governance Check
        run: python tools/audit_docs.py
